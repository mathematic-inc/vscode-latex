version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      codeql:
        patterns:
          - github/codeql-action
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    ignore:
      # VSIX packaging requires types no newer than the minimum VS Code engine.
      # Raise engines.vscode before allowing newer types.
      - dependency-name: "@types/vscode"
        versions: [">=1.135.0"]
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: gitsubmodule
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
